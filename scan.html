<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbaeen UK · Staff QR scanner</title>
<meta name="theme-color" content="#1C1012">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body{background:var(--night);color:var(--sand);min-height:100vh}
.sc{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sc-top a{color:var(--sand);text-decoration:none;display:flex;align-items:center;gap:8px;font:20px Marcellus,serif}
.who{font-size:13px;color:#BFB2A0;text-align:end}
.cam{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.cam .idle{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;color:#E9DFCC}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.manual{display:flex;gap:8px}
.manual input{flex:1;font:16px Inter,sans-serif;padding:12px;border-radius:12px;border:1px solid #5A4446;background:#2A1517;color:var(--sand);min-height:44px;text-transform:uppercase}
.result{background:#fff;color:var(--ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.result .kind{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px}
.result .id{font-size:30px;font-weight:700}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.acts .btn{min-height:56px;font-size:16px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{background:#2A1517;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.log li span{color:#BFB2A0;text-align:end}
.samples{background:#2A1517;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.samples .qrs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:12px}
.samples img{width:100%;background:#fff;border-radius:8px;padding:4px}
h2.s{font:600 15px Inter,sans-serif;color:#E9DFCC}
</style>
</head>
<body>
<main class="sc">
  <div class="sc-top">
    <a href="./"><svg width="28" height="28" viewBox="0 0 36 36" fill="none" stroke="#D9AE5B" stroke-width="1.6" aria-hidden="true"><path d="M6 32h24M9 32V18M27 32V18M9 18c0-6 4-10 9-13 5 3 9 7 9 13M18 5V2M14 32v-7a4 4 0 0 1 8 0v7"/></svg>Staff scanner</a>
    <div class="who" id="who">Preview · not signed in</div>
  </div>

  <div class="cam" id="cam">
    <video id="video" playsinline muted hidden></video>
    <div class="frame" id="frame" hidden></div>
    <div class="idle" id="idle">
      <p>Scan a volunteer, stall or tabarruk QR code.</p>
      <button type="button" class="btn gold lg" id="start">Start camera</button>
      <p class="small" id="cam-msg"></p>
    </div>
  </div>

  <form class="manual" id="manual">
    <label class="sr" for="code">Type a code</label>
    <input id="code" placeholder="Or type a code, e.g. V0001" autocomplete="off">
    <button class="btn gold" type="submit">Look up</button>
  </form>

  <section class="result" id="result" hidden aria-live="polite"></section>

  <section>
    <h2 class="s">Scanned on this phone</h2>
    <ul class="log" id="log"><li>Nothing scanned yet</li></ul>
  </section>

  <section class="samples">
    <h2 class="s">Sample codes for testing</h2>
    <p class="small" style="color:#BFB2A0">Open this page on a second phone and scan these, or tap one to try it here.</p>
    <div class="qrs" id="samples"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="lib/jsQR.js"></script>
<script src="lib/qrcode.js"></script>
<script src="js/scan.js"></script>
</body>
</html>
