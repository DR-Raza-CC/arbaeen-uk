<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbaeen UK · Stall map admin</title>
<meta name="theme-color" content="#1C1012">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.adm{max-width:1200px;margin:0 auto;padding:16px 20px 60px;display:flex;flex-direction:column;gap:16px}
.adm-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.adm-top h1{font:400 28px Marcellus,serif}
.banner{border-radius:12px;padding:12px 16px;font-size:14px}
.banner.demo{background:#FBEFE0}
.banner.live{background:#E5F1EA;color:#1E5A40}
.login{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.login .field{flex:1 1 260px}
.layout{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.layout>.panel:first-child{flex:999 1 640px;min-width:0}
.side{flex:1 1 300px;display:flex;flex-direction:column;gap:16px}
.adm .stallgrid .free{cursor:pointer;background:transparent;border:1.5px dashed #C8B994;height:52px;border-radius:6px;padding:0}
.adm .stallgrid .free.ok{background:#E5F1EA;border-color:#2E7D5B}
.adm .stallgrid .free:hover{border-color:var(--red)}
.adm .stallgrid button.sel{outline:3px solid var(--red);outline-offset:2px}
.adm .stallgrid button.req{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.55) 6px 12px)}
.unplaced{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.unplaced button{width:100%;text-align:start;background:var(--sand);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.unplaced button.sel{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.unplaced small{color:var(--muted)}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.info dt{color:var(--muted)}.info dd{margin:0;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F6EBD3;color:#8A6420}
.pill.warn{background:#F8E1E1;color:#5E161B}
.hint{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main class="adm">
  <div class="adm-top">
    <h1>Stall map admin</h1>
    <a class="btn ghostdark" href="./">Back to the site</a>
  </div>

  <p class="banner demo" id="banner">Loading…</p>

  <form class="login panel" id="login" hidden>
    <div class="field">
      <label for="key">Admin key</label>
      <input id="key" type="password" autocomplete="current-password" required>
    </div>
    <label class="tick"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn red" type="submit">Open stall map</button>
    <p class="dlg-msg" id="login-msg" role="status"></p>
  </form>

  <div class="layout" id="work" hidden>
    <section class="panel">
      <div class="sec-head"><h3>Marble Arch blocks</h3><span class="hint" id="howto">Tap a stall, then tap an empty block to move it there.</span></div>
      <div class="grid-scroll" dir="ltr"><div class="stallgrid" id="grid"></div></div>
      <div class="legend" id="legend"></div>
    </section>
    <div class="side">
      <section class="panel info" id="info">
        <h3>Selected stall</h3>
        <p class="hint" id="info-empty">Nothing selected.</p>
        <div id="info-body" hidden>
          <dl id="info-dl"></dl>
          <div class="row" style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
            <button type="button" class="btn ghostdark" id="unplace">Take off the map</button>
            <button type="button" class="btn ghostdark" id="deselect">Cancel</button>
          </div>
        </div>
      </section>
      <section class="panel">
        <h3>Not on the map yet</h3>
        <ul class="unplaced" id="unplaced"></ul>
      </section>
      <a class="btn ghostdark" id="sheet-link" href="https://docs.google.com/spreadsheets/d/1VbjW_WUgZSlYPg08ZRHLawUcVPIqL_BppZqMdaKJz4M/edit" target="_blank" rel="noopener">Open the stalls sheet</a>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/stall-admin.js"></script>
</body>
</html>
